<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>9PRA — Cutting Mat</title>
    <link rel="preload" as="image" href="./media/mat/hero.png" />
  </head>
  <body>
    <header id="topNav" class="top-nav">
      <div class="nav-left">
        <a href="./index.html" class="nav-link">9PRA</a>
        <div class="bag-group">
          <a href="#" class="nav-link nav-link-bag">bag</a>
          <span id="bagStatusText" class="bag-status" aria-live="polite">(1) $300</span>
        </div>
      </div>

      <div class="nav-mobile-center" aria-hidden="true">
        <img src="/media/menu-mobile.svg" alt="" />
      </div>

      <div class="nav-right">
        <div class="audio-controls" aria-label="Audio controls">
          <img id="radioIcon" class="audio-icon" src="/media/radio-icon-play.png" alt="" />
          <div class="audio-toggle-group">
            <button id="radioBtn" class="control-btn" type="button">Radio</button>
            <button id="noiseBtn" class="control-btn is-muted" type="button">Noise</button>
          </div>
        </div>
        <a class="nav-status" href="./shop.html" aria-label="Open shop">
          <span class="nav-online">9 online</span>
          <img class="horse-icon" src="/media/online-icon-figma.png" alt="" />
        </a>
      </div>
    </header>

    <div class="product-meta">
      <aside class="meta-bar" aria-label="Product info">
        <span class="meta-title-text">MAT9</span>
      </aside>

      <div class="color-bar" aria-label="Product color">
        <span class="color-bar-label">Grey</span>
        <div class="meta-switcher" id="metaSwitcher" aria-label="Switch mat design">
          <button id="metaSwitchFirst" class="meta-switch-btn is-active" type="button" aria-label="Mat design 1" aria-pressed="true">
            <span class="meta-switch-first-fill" aria-hidden="true">
              <span class="meta-switch-first-dot"></span>
            </span>
          </button>
          <button id="metaSwitchSecond" class="meta-switch-btn" type="button" aria-label="Mat design 2" aria-pressed="false">
            <span class="meta-switch-fill"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="cart-bar" aria-label="Purchase">
      <img class="cart-bar-shape" src="/media/cart-bar-shape.svg" alt="" aria-hidden="true" draggable="false" />
      <button
        id="addToCart"
        class="cart-bar-btn"
        type="button"
        aria-pressed="false"
        aria-label="Add to cart, $300"
      ></button>
    </div>
    <div class="cart-bar-ui" aria-hidden="true">
      <span class="cart-price">$300</span>
      <span class="cart-label">Add to cart</span>
    </div>

    <main id="smoothRoot">
      <section class="panel panel-hero contrast-target" data-contrast-type="media" data-hero-mode="static">
        <div class="mat-hero-root" aria-label="MAT9 product view">
          <img class="panel-media" src="/media/mat/hero.png" alt="" decoding="async" />
        </div>
      </section>

      <section class="image-grid-section contrast-target" data-contrast-type="media">
        <div class="image-grid-row image-grid-row-two">
          <div class="image-grid-cell">
            <img class="image-grid-item" src="/media/mat/grid-top-left.png" alt="" loading="lazy" decoding="async" />
          </div>
          <div class="image-grid-cell">
            <img class="image-grid-item" src="/media/mat/grid-top-right.png" alt="" loading="lazy" decoding="async" />
          </div>
        </div>
        <div class="image-grid-row image-grid-row-split">
          <div class="image-grid-cell image-grid-cell-tall">
            <img class="image-grid-item" src="/media/mat/grid-middle.png" alt="" loading="lazy" decoding="async" />
          </div>
          <div class="image-grid-stack">
            <div class="image-grid-cell">
              <img class="image-grid-item" src="/media/mat/hero.png" alt="" loading="lazy" decoding="async" />
            </div>
            <div class="image-grid-cell image-grid-cell-specs">
              <img
                class="image-grid-specs"
                src="/media/mat/grid-specs.png"
                alt="Packed in a cardboard tube. Product size: 45×30cm. Material: PVC cutting mat."
                loading="lazy"
                decoding="async"
              />
            </div>
          </div>
        </div>
      </section>

      <section
        id="scratchSection"
        class="panel panel-scratch contrast-target"
        data-contrast-type="media"
        aria-label="Scratch to reveal"
      >
        <img
          class="scratch-reveal"
          src="/media/mat/scratch-reveal.png"
          alt=""
          decoding="async"
          loading="lazy"
          draggable="false"
        />
        <canvas id="scratchCanvas" class="scratch-canvas" aria-hidden="true"></canvas>
      </section>

      <section
        id="cutMatSection"
        class="panel panel-cut-mat contrast-target"
        data-contrast-type="media"
        aria-label="Cut objects on the mat"
      >
        <img class="cut-mat-surface" src="/media/mat/grid-middle.png" alt="" draggable="false" />

        <div class="cut-mat-stage" id="cutMatStage">
          <canvas
            class="cut-object"
            data-cut-id="scrap-eye"
            width="220"
            height="160"
            style="left: 14%; top: 22%; width: min(18vw, 220px); height: auto;"
            aria-hidden="true"
          ></canvas>
          <canvas
            class="cut-object"
            data-cut-id="scrap-tape"
            width="280"
            height="70"
            style="left: 58%; top: 48%; width: min(22vw, 280px); height: auto; transform: rotate(-12deg);"
            aria-hidden="true"
          ></canvas>
          <canvas
            class="cut-object"
            data-cut-id="scrap-blade"
            width="90"
            height="260"
            style="left: 38%; top: 30%; width: min(7vw, 90px); height: auto; transform: rotate(8deg);"
            aria-hidden="true"
          ></canvas>

          <div class="mat-sticker-host" id="matStickerA" style="left: 22%; top: 58%;"></div>
          <div class="mat-sticker-host" id="matStickerB" style="left: 68%; top: 18%;"></div>
        </div>

      </section>
    </main>

    <audio id="radioPlayer" preload="metadata"></audio>

    <script type="module" src="/src/mat.js"></script>
  </body>
</html>
