<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>9PRA — Cutting Mat</title>
    <link rel="preload" as="image" href="./media/mat_frames/cell_13.webp" />
    <link rel="preload" as="image" href="./media/mat_frames/cell_12.webp" />
    <link rel="preload" as="image" href="./media/mat_frames/cell_11.webp" />
    <link rel="preload" as="image" href="./media/mat_frames/cell_14.webp" />
    <link rel="preload" as="image" href="./media/mat_frames/cell_15.webp" />
    <link rel="preload" as="image" href="./media/mat_frames/cell_23.webp" />
    <link rel="preload" as="image" href="./media/mat_frames/cell_03.webp" />
  </head>
  <body>
    <header id="topNav" class="top-nav">
      <div class="nav-left">
        <a href="./index.html" class="nav-link">9PRA</a>
        <div class="bag-group">
          <a href="#" class="nav-link nav-link-bag">bag</a>
          <span id="bagStatusText" class="bag-status" aria-live="polite">(1) $300</span>
        </div>
      </div>

      <div class="nav-mobile-center" aria-hidden="true">
        <img src="/media/menu-mobile.svg" alt="" />
      </div>

      <div class="nav-right">
        <div class="audio-controls" aria-label="Audio controls">
          <img id="radioIcon" class="audio-icon" src="/media/radio-icon-play.png" alt="" />
          <div class="audio-toggle-group">
            <button id="radioBtn" class="control-btn" type="button">Radio</button>
            <button id="noiseBtn" class="control-btn is-muted" type="button">Noise</button>
          </div>
        </div>
        <a class="nav-status" href="./shop.html" aria-label="Open shop">
          <span class="nav-online">9 online</span>
          <img class="horse-icon" src="/media/online-icon-figma.png" alt="" />
        </a>
      </div>
    </header>

    <div class="product-meta">
      <aside class="meta-bar" aria-label="Product info">
        <span class="meta-title-text">MAT9</span>
      </aside>

    </div>

    <div class="cart-bar" aria-label="Purchase">
      <img class="cart-bar-shape" src="/media/cart-bar-shape.svg" alt="" aria-hidden="true" draggable="false" />
      <button
        id="addToCart"
        class="cart-bar-btn"
        type="button"
        aria-pressed="false"
        aria-label="Add to cart, $300"
      ></button>
    </div>
    <div class="cart-bar-ui" aria-hidden="true">
      <span class="cart-price">$300</span>
      <span class="cart-label">Add to cart</span>
    </div>

    <main id="smoothRoot">
      <section class="panel panel-hero contrast-target" data-contrast-type="media" data-hero-mode="directional">
        <div id="productViewerRoot" class="product-viewer-root" aria-label="MAT9 product view"></div>
      </section>

      <section class="image-grid-section contrast-target" data-contrast-type="media">
        <div class="image-grid-row image-grid-row-two">
          <div class="image-grid-cell">
            <img class="image-grid-item" src="/media/mat/grid-top-left.png" alt="" loading="lazy" decoding="async" />
          </div>
          <div class="image-grid-cell">
            <img class="image-grid-item" src="/media/mat/grid-top-right.png" alt="" loading="lazy" decoding="async" />
          </div>
        </div>
        <div class="image-grid-row image-grid-row-split">
          <div class="image-grid-cell image-grid-cell-tall">
            <img class="image-grid-item" src="/media/mat/grid-middle.png" alt="" loading="lazy" decoding="async" />
          </div>
          <div class="image-grid-stack">
            <div class="image-grid-cell">
              <img class="image-grid-item" src="/media/mat/grid-bottom.png" alt="" loading="lazy" decoding="async" />
            </div>
            <div class="image-grid-cell image-grid-cell-specs">
              <img
                class="image-grid-specs"
                src="/media/mat/grid-specs.png"
                alt="Packed in a cardboard box with a handle. Product size: 22×16.5×8.5cm. Material: Porcelain."
                loading="lazy"
                decoding="async"
              />
            </div>
          </div>
        </div>
      </section>

      <section
        id="scratchSection"
        class="panel panel-scratch contrast-target"
        data-contrast-type="media"
        aria-label="Scratch to reveal"
      >
        <video
          id="scratchReveal"
          class="scratch-reveal"
          src="/media/scratch/reveal.mp4"
          muted
          playsinline
          loop
          autoplay
          preload="auto"
        ></video>
        <canvas id="scratchCanvas" class="scratch-canvas" aria-hidden="true"></canvas>
      </section>

      <section
        id="drawMatSection"
        class="panel panel-draw-mat contrast-target"
        data-contrast-type="media"
        aria-label="Draw on paper scraps"
      >
        <img
          class="draw-mat-surface"
          src="/media/mat/draw-mat-bg.webp"
          alt=""
          draggable="false"
          decoding="async"
        />

        <div class="draw-mat-stage" id="drawMatStage">
          <!-- Figma 49:31 @ 1440×800 — large drawable scrap (1 16) -->
          <div
            class="draw-paper"
            data-paper="c"
            data-drawable="true"
            style="--paper-rotate: 27.26deg; left: 30.6%; top: 43%; width: 18.1%;"
          >
            <div class="draw-paper-rotator">
              <img class="draw-paper-bg" src="/media/mat/paper-c.png" alt="" draggable="false" />
              <canvas class="draw-paper-canvas" aria-hidden="true"></canvas>
            </div>
          </div>
          <!-- Square drawable scrap (Paper-1) -->
          <div
            class="draw-paper"
            data-paper="b"
            data-drawable="true"
            style="--paper-rotate: -5deg; left: 62.7%; top: 52.2%; width: 13.5%;"
          >
            <div class="draw-paper-rotator">
              <img class="draw-paper-bg" src="/media/mat/paper-b.png" alt="" draggable="false" />
              <canvas class="draw-paper-canvas" aria-hidden="true"></canvas>
            </div>
          </div>
          <!-- Small right scrap (Paper) -->
          <div
            class="draw-paper"
            data-paper="a"
            data-drawable="true"
            data-flip="y"
            style="--paper-rotate: -175deg; left: 65.05%; top: 38.66%; width: 13.5%;"
          >
            <div class="draw-paper-rotator">
              <img class="draw-paper-bg" src="/media/mat/paper-a.png" alt="" draggable="false" />
              <canvas class="draw-paper-canvas" aria-hidden="true"></canvas>
            </div>
          </div>
          <!-- Upper small leaflets — move only (7 7) -->
          <div
            class="draw-paper"
            data-paper="d"
            data-drawable="false"
            style="--paper-rotate: 0deg; left: 20.07%; top: 4.63%; width: 12.78%;"
          >
            <div class="draw-paper-rotator">
              <img class="draw-paper-bg" src="/media/mat/paper-d.png" alt="" draggable="false" />
            </div>
          </div>
        </div>
      </section>
    </main>

    <audio id="radioPlayer" preload="metadata"></audio>

    <script type="module" src="/src/mat.js"></script>
  </body>
</html>
