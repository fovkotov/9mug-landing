<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>9PRA</title>
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-left">
        <a href="./index.html" class="nav-link">9PRA</a>
      </div>

      <div class="nav-mobile-center" aria-hidden="true">
        <img src="/media/menu-mobile.svg" alt="" />
      </div>

      <div class="nav-right">
        <div class="bag-group">
          <a href="#" class="nav-link nav-link-bag">Cart</a>
          <span id="bagStatusText" class="bag-status" aria-live="polite"></span>
        </div>
        <div class="audio-controls" aria-label="Audio controls">
          <img id="radioIcon" class="audio-icon" src="/media/radio-icon-play.svg" alt="" />
          <div class="audio-toggle-group">
            <button id="radioBtn" class="control-btn" type="button">Radio</button>
            <button id="noiseBtn" class="control-btn is-muted" type="button">Noise</button>
          </div>
        </div>
        <a class="nav-status" href="./shop.html" aria-label="Open shop">
          <span class="nav-online">9 Online</span>
          <img class="horse-icon" src="/media/online-icon-figma.png" alt="" />
        </a>
      </div>
    </header>

    <div id="page" data-route="shop" tabindex="-1">

    <aside class="meta-left desktop-only" aria-label="Section menu">
      <a class="meta-item is-active" href="#section-mug" data-section-link>9MUG</a>
      <a class="meta-item" href="#section-texture" data-section-link>Texture Pack</a>
      <a class="meta-item" href="#section-mat" data-section-link>Cutting Mat</a>
    </aside>

    <main class="home-main">
      <section id="section-mug" class="home-panel home-panel-hero">
        <a class="hero-panel-link" href="./product.html" aria-label="Open product page"></a>
        <picture class="home-media">
          <source media="(max-width: 900px)" srcset="/media/home/hero-mobile.png" />
          <img src="/media/home/hero-desktop.png" alt="" />
        </picture>
        <p class="mobile-panel-title">9MUG</p>
      </section>

      <section id="section-texture" class="home-panel home-panel-frame">
        <picture class="home-media">
          <source media="(max-width: 900px)" srcset="/media/home/frame-mobile.png" />
          <img src="/media/home/frame-desktop.png" alt="" />
        </picture>
        <p class="mobile-panel-title">Texture Pack</p>
      </section>

      <section id="section-mat" class="home-panel home-panel-mat">
        <a class="hero-panel-link" href="./mat.html" aria-label="Open cutting mat page"></a>
        <picture class="home-media">
          <source media="(max-width: 900px)" srcset="/media/home/mat-mobile.png" />
          <img src="/media/home/mat-desktop.png" alt="" />
        </picture>
        <p class="mobile-panel-title is-light">Cutting Mat</p>
      </section>
    </main>
    <footer class="site-footer">
      <div class="site-footer__contact">
        <span class="site-footer__item">Instagram</span>
        <a class="site-footer__item" href="mailto:9pra@gmail.com">9pra@gmail.com</a>
      </div>
      <div class="site-footer__legal">
        <span class="site-footer__item">Privacy Policy</span>
        <span class="site-footer__item">Terms and conditions</span>
        <span class="site-footer__item">Returns Policy</span>
      </div>
    </footer>
    </div>

    <audio id="radioPlayer" preload="metadata"></audio>

    <script type="module" src="/src/shell.js"></script>
  </body>
</html>
