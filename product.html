<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>9PRA</title>
    <link rel="preload" as="image" href="./media/mug_frames/center.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/left.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/far_left.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/right.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/far_right.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/up.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/down.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/up_left.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/up_right.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/down_left.webp" />
    <link rel="preload" as="image" href="./media/mug_frames/down_right.webp" />
  </head>
  <body>
    <header id="topNav" class="top-nav">
      <div class="nav-left">
        <a href="./index.html" class="nav-link">9PRA</a>
        <div class="bag-group">
          <a href="#" class="nav-link nav-link-bag">bag</a>
          <span id="bagStatusText" class="bag-status" aria-live="polite">(1) $300</span>
        </div>
      </div>

      <div class="nav-mobile-center" aria-hidden="true">
        <img src="/media/menu-mobile.svg" alt="" />
      </div>

      <div class="nav-right">
        <div class="audio-controls" aria-label="Audio controls">
          <img id="radioIcon" class="audio-icon" src="/media/radio-icon-play.png" alt="" />
          <div class="audio-toggle-group">
            <button id="radioBtn" class="control-btn" type="button">Radio</button>
            <button id="noiseBtn" class="control-btn is-muted" type="button">Noise</button>
          </div>
        </div>
        <a class="nav-status" href="./shop.html" aria-label="Open shop">
          <span class="nav-online">9 online</span>
          <img class="horse-icon" src="/media/online-icon-figma.png" alt="" />
        </a>
      </div>
    </header>

    <aside class="meta-bar" aria-label="Product info">
      <span class="meta-title-text">MUG9</span>
    </aside>

    <div class="color-bar" aria-label="Product color">
      <span class="color-bar-label">White</span>
      <div class="meta-switcher" id="metaSwitcher" aria-label="Switch mug design">
        <button id="metaSwitchFirst" class="meta-switch-btn is-active" type="button" aria-label="Mug design 1" aria-pressed="true">
          <span class="meta-switch-first-fill" aria-hidden="true">
            <span class="meta-switch-first-dot"></span>
          </span>
        </button>
        <button id="metaSwitchSecond" class="meta-switch-btn" type="button" aria-label="Mug design 2" aria-pressed="false">
          <span class="meta-switch-fill"></span>
        </button>
      </div>
    </div>

    <div class="cart-bar" aria-label="Purchase">
      <img class="cart-bar-shape" src="/media/cart-bar-shape.svg" alt="" aria-hidden="true" draggable="false" />
      <div class="cart-bar-ui" aria-hidden="true">
        <span class="cart-price">$300</span>
        <span class="cart-label">Add to cart</span>
      </div>
      <button
        id="addToCart"
        class="cart-bar-btn"
        type="button"
        aria-pressed="false"
        aria-label="Add to cart, $300"
      ></button>
    </div>

    <main id="smoothRoot">
      <section class="panel panel-hero contrast-target" data-contrast-type="media" data-hero-mode="directional">
        <!-- Active: directional ProductViewer (mug_frames look-around) -->
        <div id="productViewerRoot" class="product-viewer-root" aria-label="MUG9 product view"></div>

        <!--
          Legacy slide hero — exact previous first-screen interaction.
          Restore via src/hero/hero-mode.js → HERO_INTERACTION_MODE = "legacy-slides"
          (also see src/hero/legacy-hero.fragment.html).
        -->
        <div id="legacyHeroRoot" class="legacy-hero-root" hidden>
          <img id="heroDesktopImage" class="panel-media desktop-only" src="/media/hero-desktop.png" alt="" />
          <img id="heroMobileImage" class="panel-media mobile-only" src="/media/hero-mobile.png" alt="" />
          <div
            id="heroDragSlider"
            class="hero-drag-slider scroll-indicator"
            role="slider"
            aria-label="Switch mug design"
            aria-valuemin="1"
            aria-valuemax="4"
            aria-valuenow="1"
            tabindex="0"
          >
            <span class="line left" aria-hidden="true"></span>
            <span class="line right" aria-hidden="true"></span>
          </div>
        </div>
      </section>

      <section class="image-grid-section contrast-target" data-contrast-type="media">
        <div class="image-grid-row image-grid-row-two">
          <div class="image-grid-cell">
            <img class="image-grid-item" src="/media/grid-top-left.png" alt="" loading="lazy" decoding="async" />
          </div>
          <div class="image-grid-cell">
            <img class="image-grid-item" src="/media/grid-top-right.png" alt="" loading="lazy" decoding="async" />
          </div>
        </div>
        <div class="image-grid-row image-grid-row-split">
          <div class="image-grid-cell image-grid-cell-tall">
            <img class="image-grid-item" src="/media/grid-middle.png" alt="" loading="lazy" decoding="async" />
          </div>
          <div class="image-grid-stack">
            <div class="image-grid-cell">
              <img class="image-grid-item" src="/media/grid-bottom-left.png" alt="" loading="lazy" decoding="async" />
            </div>
            <div class="image-grid-cell image-grid-cell-specs">
              <img
                class="image-grid-specs desktop-only"
                src="/media/grid-specs-desktop.png"
                alt="Packed in a cardboard box with a handle. Product size: 22×16.5×8.5cm. Material: Porcelain."
                loading="lazy"
                decoding="async"
              />
              <img
                class="image-grid-specs mobile-only"
                src="/media/grid-specs-mobile.png"
                alt="Packed in a cardboard box with a handle. Product size: 22×16.5×8.5cm. Material: Porcelain."
                loading="lazy"
                decoding="async"
              />
            </div>
          </div>
        </div>
      </section>

      <section
        id="scratchSection"
        class="panel panel-scratch contrast-target"
        data-contrast-type="media"
        aria-label="Scratch to reveal"
      >
        <img
          class="scratch-reveal desktop-only"
          src="/media/scratch/reveal-desktop-1x.webp"
          srcset="/media/scratch/reveal-desktop-1x.webp 1440w, /media/scratch/reveal-desktop.webp 2880w"
          sizes="100vw"
          alt=""
          decoding="async"
          loading="lazy"
          draggable="false"
        />
        <img
          class="scratch-reveal mobile-only"
          src="/media/scratch/reveal-mobile-1x.webp"
          srcset="/media/scratch/reveal-mobile-1x.webp 402w, /media/scratch/reveal-mobile.webp 804w"
          sizes="100vw"
          alt=""
          decoding="async"
          loading="lazy"
          draggable="false"
        />
        <canvas id="scratchCanvas" class="scratch-canvas" aria-hidden="true"></canvas>
      </section>

      <section id="scrollVideoSection" class="scroll-video-section contrast-target" data-contrast-type="video">
        <div class="scroll-video-sticky">
          <video
            id="scrollVideo"
            class="panel-video"
            src="/media/scroll-video.mp4"
            muted
            playsinline
            preload="auto"
          ></video>
        </div>
      </section>
    </main>

    <audio id="radioPlayer" preload="metadata"></audio>

    <script type="module" src="/src/product.js"></script>
  </body>
</html>
